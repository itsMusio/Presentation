<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSA Purification Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="ambient ambient--left" aria-hidden="true"></div>
  <div class="ambient ambient--right" aria-hidden="true"></div>
  <div class="menu-backdrop" id="menuBackdrop" hidden aria-hidden="true"></div>
  <aside class="slide-menu" id="slideMenu" aria-label="Slide menu" aria-hidden="true">
    <div class="slide-menu__head">
      <h2 class="slide-menu__title">Slides</h2>
    </div>
    <nav class="slide-menu__nav" id="slideMenuNav"></nav>
  </aside>
  <button
    class="menu-handle"
    id="menuBtn"
    type="button"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="slideMenu"
    aria-label="Expand slide menu"
  >
    <span class="menu-handle__glyph" id="menuGlyph" aria-hidden="true">&gt;</span>
  </button>

  <main class="deck" role="application" aria-label="Presentation deck">
    <header class="toolbar">
      <div class="toolbar__meta">
        <p class="kicker" id="deckKicker">Research Presentation</p>
        <h1 class="deck-title" id="deckTitle"></h1>
      </div>
      <div class="toolbar__controls">
        <button class="btn btn--icon" id="homeBtn" type="button" aria-label="First slide" title="First slide">
          <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5L12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M6.5 9.8V20h11V9.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="btn" id="prevBtn" type="button" aria-label="Previous slide">Prev</button>
        <span class="counter" id="counter"></span>
        <button class="btn" id="nextBtn" type="button" aria-label="Next slide">Next</button>
      </div>
    </header>

    <section class="slide-root" id="slideRoot" aria-live="polite"></section>

    <footer class="progress-wrap" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </footer>
    <p class="help">Use Arrow keys, Space, Home/End, or swipe on mobile.</p>
  </main>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
